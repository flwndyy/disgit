name = "disgit"
main = "src/index.ts"
compatibility_date = "2025-01-01"

workers_dev = true

[vars]
IGNORED_BRANCH_REGEX="^__none__$"
IGNORED_BRANCHES="__none__"
IGNORED_USERS="__none__"
IGNORED_PAYLOADS="__none__"
IGNORED_CHECK_RUNS="__none__"
DEBUG_PASTE=false
EXECUTE_MERGE_QUEUE_BRANCHES=false

# Uses secrets:
# - GITHUB_WEBHOOK_SECRET
# Run `echo <VALUE> | wrangler secret put <NAME>` for each of these
